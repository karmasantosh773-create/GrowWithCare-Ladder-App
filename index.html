<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GWC F&O Ladder Scan</title>
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GWC Ladder">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #e8e8ea;
    --muted: #8b8f9a;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f5c518;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 16px calc(12px + env(safe-area-inset-top, 0px));
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  header h1 { margin: 0 0 10px; font-size: 18px; }
  header h1 span { color: var(--yellow); }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 160px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 12px; font-size: 14px;
  }
  .filterbtn {
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .filterbtn.active { color: var(--bg); background: var(--yellow); border-color: var(--yellow); font-weight: 600; }

  main { padding: 12px; max-width: 900px; margin: 0 auto; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .meta { color: var(--muted); font-size: 12px; margin: 4px 2px 12px; }

  .stock-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
  }
  .stock-sym { font-weight: 700; font-size: 15px; grid-column: 1 / 2; }
  .stock-cmp { font-size: 15px; grid-column: 2 / 3; text-align: right; }
  .stock-row2 { grid-column: 1 / 3; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pct-drop { color: var(--red); font-weight: 600; }
  .pct-rise { color: var(--green); font-weight: 600; }

  .empty, .loading { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>GWC F&amp;O <span>Ladder Scan</span></h1>
  <div class="controls">
    <input class="search" id="searchBox" type="text" placeholder="Symbol search karo (jaise RELIANCE)">
  </div>
  <div class="controls" style="margin-top:8px;">
    <button class="filterbtn active" data-f="all">Sab</button>
    <button class="filterbtn" data-f="broke_top">ATH se 6.25%+ tooÑ‚Ðµ</button>
    <button class="filterbtn" data-f="rose_bottom">Low se 6.25%+ uthe</button>
  </div>
</header>

<main>
  <div class="meta" id="metaInfo">Loading...</div>
  <div id="list"><div class="loading">Data load ho raha hai...</div></div>
</main>

<script>
  // Yahi wo Apps Script Web App URL hai jo backend/data deta hai
  var DATA_URL = "https://script.google.com/macros/s/AKfycbwXhM7TY4yhe-pWyAgPZmB6UmPWC3H4FhiQWim4ibME0EuhAlTrW857ePJ45g19Fq-i/exec?format=json";

  var ALL_ROWS = [];
  var currentFilter = "all";

  function fmtNum(v) {
    if (v === "" || v === null || typeof v === "undefined" || isNaN(v)) return "-";
    return Number(v).toLocaleString("en-IN", { maximumFractionDigits: 2 });
  }
  function fmtPct(v) {
    if (v === "" || v === null || typeof v === "undefined" || isNaN(v)) return "-";
    return Number(v).toFixed(2) + "%";
  }

  function render() {
    var q = document.getElementById("searchBox").value.trim().toUpperCase();
    var rows = ALL_ROWS.filter(function (r) {
      if (q && String(r.Symbol).toUpperCase().indexOf(q) < 0) return false;
      if (currentFilter === "broke_top" && !(Number(r.Drawdown_Pct) >= 6.25)) return false;
      if (currentFilter === "rose_bottom" && !(Number(r.Rise_Pct) >= 6.25)) return false;
      return true;
    });

    document.getElementById("metaInfo").textContent =
      rows.length + " stocks mil rahe hain (kul " + ALL_ROWS.length + " mein se)";

    var html = "";
    if (rows.length === 0) {
      html = '<div class="empty">Koi stock nahi mila.</div>';
    } else {
      rows.forEach(function (r) {
        html += '<div class="stock-card">' +
          '<div class="stock-sym">' + r.Symbol + '</div>' +
          '<div class="stock-cmp">' + fmtNum(r.CMP) + '</div>' +
          '<div class="stock-row2">' +
            '<span>ATH: ' + fmtNum(r.ATH) + ' (' + (r.ATH_Date || "-") + ')</span>' +
            '<span class="pct-drop">-' + fmtPct(r.Drawdown_Pct) + '</span>' +
          '</div>' +
          '<div class="stock-row2">' +
            '<span>Recent Low: ' + fmtNum(r.Recent_Low) + ' (' + (r.Recent_Low_Date || "-") + ')</span>' +
            '<span class="pct-rise">+' + fmtPct(r.Rise_Pct) + '</span>' +
          '</div>' +
        '</div>';
      });
    }
    document.getElementById("list").innerHTML = html;
  }

  function loadData() {
    fetch(DATA_URL).then(function (res) { return res.json(); }).then(function (data) {
      ALL_ROWS = data;
      render();
    }).catch(function (err) {
      document.getElementById("metaInfo").textContent = "Data load nahi ho paya: " + err;
      document.getElementById("list").innerHTML = '<div class="empty">Data load nahi ho paya. Internet check karein.</div>';
    });
  }

  document.getElementById("searchBox").addEventListener("input", render);
  document.querySelectorAll(".filterbtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".filterbtn").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentFilter = btn.getAttribute("data-f");
      render();
    });
  });

  loadData();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>

</body>
</html>
